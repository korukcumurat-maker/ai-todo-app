<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Powered To-Do List</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="glass-card">
    <header>
      <h1>AI To-Do List 🚀</h1>
      <p>Gemini Destekli Akıllı Görev Yöneticisi</p>
    </header>

    <!-- API KEY ALANI -->
    <div class="api-section">
      <input type="password" id="apiKeyInput" placeholder="Gemini API Key Girin..." />
      <button id="saveKeyBtn">Kaydet</button>
    </div>

    <!-- İLERLEME ÇUBUĞU -->
    <div class="progress-container">
      <div class="progress-info">
        <span id="progressText">0/0 Tamamlandı (%0)</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- GİRDİ FORMU -->
    <div class="input-section">
      <input type="text" id="taskInput" placeholder="Yeni bir görev yazın..." />
      <input type="datetime-local" id="taskDateInput" />
      
      <select id="taskCategoryInput">
        <option value="Genel">📁 Genel</option>
        <option value="İş">💼 İş</option>
        <option value="Kişisel">👤 Kişisel</option>
        <option value="Alışveriş">🛒 Alışveriş</option>
        <option value="Sağlık">❤️ Sağlık</option>
      </select>

      <select id="taskPriorityInput">
        <option value="Düşük">🟢 Düşük</option>
        <option value="Orta" selected>🟡 Orta</option>
        <option value="Yüksek">🔴 Yüksek</option>
      </select>

      <button id="addTaskBtn" class="primary-btn">Ekle</button>
      <button id="aiSuggestBtn" class="ai-btn">✨ AI Öneri</button>
      <button id="aiAnalyzeBtn" class="ai-analyze-btn">🧠 AI Öncelik Analizi</button>
    </div>

    <!-- FİLTRELEME BUTONLARI -->
    <div class="filter-section">
      <button class="filter-btn active" data-filter="all">Tümü</button>
      <button class="filter-btn" data-filter="active">Aktif</button>
      <button class="filter-btn" data-filter="completed">Tamamlanan</button>
    </div>

    <div id="aiLoading" class="hidden">Gemini düşünceler topluyor... 🤖</div>
    <div id="aiAnalysisResult" class="ai-box hidden"></div>

    <ul id="taskList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
